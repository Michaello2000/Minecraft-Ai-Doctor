[package]
name = "minecraft-ai-doctor"
version = "0.1.0"
edition = "2024"
license = "MIT"
description = "Read-only Minecraft log and mod compatibility doctor"

[dependencies]
eframe = { version = "0.33.3", default-features = false, features = ["default_fonts", "glow", "accesskit", "x11", "wayland"] }
rfd = "0.16"
serde = { version = "1", features = ["derive"] }
serde_json = "1"
regex = "1"
semver = "1"
toml = "0.9"
zip = { version = "2.4", default-features = false, features = ["deflate"] }
reqwest = { version = "0.12", default-features = false, features = ["json", "rustls-tls"] }
keyring = { version = "3.6", features = ["windows-native"] }
sha2 = "0.10"
tokio = { version = "1", features = ["rt", "time", "macros"] }
image = {version="0.25",default-features=false,features=["png","jpeg","webp","ico"]}
resvg = {version="0.49",default-features=false}

[build-dependencies]
embed-resource = "3.0.11"
resvg = {version="0.49",default-features=false}
serde_json = "1"

[dev-dependencies]
tempfile = "3"

[profile.release]
strip = true

